<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UTRADE | Адмін</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f0f4f8;--surface:#fff;--surface2:#f7f9fc;--border:#e2e8f0;--text:#0f172a;--text2:#64748b;--accent:#2563eb;--green:#10b981;--red:#ef4444;}
[data-theme=dark]{--bg:#0d1117;--surface:#161b22;--surface2:#0d1117;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#58a6ff;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Manrope',sans-serif;background:var(--bg);color:var(--text);}
.bebas{font-family:'Bebas Neue',sans-serif;}
.sec-title{font-size:.6rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--text2);}
input,select,textarea{background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:.65rem;font-family:'Manrope',sans-serif;transition:border-color .15s;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);}
input::placeholder,textarea::placeholder{color:var(--text2);}
nav{background:var(--surface);border-bottom:1px solid var(--border);}
.cscroll::-webkit-scrollbar{width:4px;}
.cscroll::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:10px;}

.tbl{width:100%;border-collapse:collapse;font-size:.72rem;}
.tbl th{text-align:left;padding:.5rem .65rem;background:var(--surface);border-bottom:2px solid var(--border);font-size:.58rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--text2);white-space:nowrap;position:sticky;top:0;z-index:5;}
.tbl td{padding:.55rem .65rem;border-bottom:1px solid var(--border);vertical-align:middle;}
.tbl tr:hover td{background:var(--surface2);}

.tab{padding:.5rem 1rem;font-size:.72rem;font-weight:800;border-radius:.65rem;cursor:pointer;transition:all .15s;white-space:nowrap;}
.tab.active{background:var(--accent);color:#fff;}
.tab:not(.active){background:var(--surface);border:1px solid var(--border);color:var(--text2);}
.tab:not(.active):hover{border-color:var(--accent);color:var(--accent);}

#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#0f172a;color:#fff;padding:10px 22px;border-radius:999px;font-size:12px;font-weight:800;z-index:9999;transition:transform .3s;pointer-events:none;white-space:nowrap;}
#toast.show{transform:translateX(-50%) translateY(0);}
[data-theme=dark] #toast{background:#58a6ff;color:#000;}

#loginScreen{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:1rem;background:linear-gradient(135deg,#1a0a00,#3d1800);}

/* Modal деталей */
#orderModal{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:1rem;overflow-y:auto;}
#orderModal.show{display:flex;}
.order-modal-box{background:var(--surface);border-radius:1.25rem;width:100%;max-width:700px;max-height:90vh;overflow-y:auto;box-shadow:0 25px 60px rgba(0,0,0,.35);}
.modal-header{padding:1.5rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--surface);z-index:10;}
.modal-body{padding:1.5rem;display:flex;flex-direction:column;gap:1.25rem;}
.modal-tabs{display:flex;gap:.5rem;border-bottom:1px solid var(--border);padding:0 1.5rem;margin-bottom:0;}
.modal-tab{padding:.65rem 1rem;font-size:.75rem;font-weight:800;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;color:var(--text2);}
.modal-tab.active{border-bottom-color:var(--accent);color:var(--accent);}

.item-edit{background:var(--surface2);border:1px solid var(--border);border-radius:1rem;padding:1rem;margin-bottom:.75rem;}
.item-edit-row{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:.5rem;}
.item-edit-row.full{grid-template-columns:1fr;}
.item-label{font-size:.65rem;font-weight:800;color:var(--text2);text-transform:uppercase;margin-bottom:.25rem;display:block;}
.item-edit input{font-size:.8rem;padding:.5rem;}

.spin{width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body data-theme="light">
<div id="toast"></div>

<!-- ЛОГІН -->

<script>
const WORKER = 'https://utrade-orders.lozko1991.workers.dev';
let adminToken = '', allOrders = [], allDropers = [], allBalances = {};
let editingOrder = null;

// ── THEME ──────────────────────────────────────────────
function toggleTheme() {
  const dark = document.body.getAttribute('data-theme') !== 'dark';
  document.body.setAttribute('data-theme', dark ? 'dark' : 'light');
  document.getElementById('themeIcon').className = dark ? 'fa-solid fa-sun text-xs' : 'fa-solid fa-moon text-xs';
  localStorage.setItem('utrade_theme', dark ? 'dark' : 'light');
}
(function(){
  if (localStorage.getItem('utrade_theme') === 'dark') {
    document.body.setAttribute('data-theme','dark');
    document.getElementById('themeIcon').className = 'fa-solid fa-sun text-xs';
  }
})();

// ── TOAST ──────────────────────────────────────────────
function toast(msg, dur=2500) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), dur);
}

// ── API ────────────────────────────────────────────────
async function api(action, body={}) {
  const res = await fetch(WORKER, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, adminToken, ...body }),
  });
  if (!res.ok) {
    const text = await res.text();
    throw new Error(`HTTP ${res.status}: ${text.slice(0,100)}`);
  }
  return res.json();
}

// ── LOGIN ──────────────────────────────────────────────
async function doAdminLogin() {
  const pass = document.getElementById('loginPass').value.trim();
  if (!pass) return;
  const btn = document.getElementById('loginBtn');
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
  btn.disabled = true;
  try {
    const res = await api('adminLogin', { password: pass });
    if (!res.ok) throw new Error(res.error || 'Невірний пароль');
    adminToken = res.token;
    sessionStorage.setItem('utrade_admin', adminToken);
    document.getElementById('loginScreen').style.display = 'none';
    initAdmin();
  } catch(e) {
    toast('❌ ' + (e.message || 'Помилка з'єднання'));
    btn.innerHTML = '<i class="fa-solid fa-unlock"></i> Увійти';
    btn.disabled = false;
    console.error('Login error:', e);
  }
}
function doAdminLogout() { adminToken=''; sessionStorage.removeItem('utrade_admin'); location.reload(); }
(function(){
  const s = sessionStorage.getItem('utrade_admin');
  if (s) { adminToken = s; document.getElementById('loginScreen').style.display='none'; initAdmin(); }
})();

// ── INIT ───────────────────────────────────────────────
async function initAdmin() {
  document.getElementById('statsSection').classList.remove('hidden');
  document.getElementById('tabsRow').classList.remove('hidden');
  document.getElementById('ordersFilters').classList.remove('hidden');
  document.getElementById('loadingBlock').classList.remove('hidden');
  await Promise.all([loadOrders(), loadDropers(), loadBalances()]);
  document.getElementById('loadingBlock').classList.add('hidden');
  renderOrders();
  updateStats();
}

// ── TABS ───────────────────────────────────────────────
function switchTab(tab) {
  ['orders','dropers'].forEach(t => {
    document.getElementById('tab'+t.charAt(0).toUpperCase()+t.slice(1)).classList.toggle('active', t===tab);
    document.getElementById(t+'Section').classList.toggle('hidden', t!==tab);
    if (t==='ordersFilters') document.getElementById('ordersFilters')?.classList.toggle('hidden', t!==tab);
  });
  if (tab==='dropers') renderDropers();
}

function switchModalTab(tab) {
  ['items','order','prices','notes'].forEach(t => {
    document.getElementById('modalTab-'+t).style.display = t===tab ? 'block' : 'none';
    document.querySelector(`[onclick*="'${t}'"]`)?.classList.toggle('active', t===tab);
  });
}

// ── LOAD ───────────────────────────────────────────────
async function loadOrders() {
  const res = await api('getAllOrders');
  if (res.ok) allOrders = res.orders || [];
}
async function loadDropers() {
  const res = await api('getDropers');
  if (res.ok) allDropers = res.dropers || [];
}
async function loadBalances() {
  const res = await api('getAllBalances');
  if (res.ok) allBalances = res.balances || {};
}
async function refreshAll() {
  document.getElementById('loadingBlock').classList.remove('hidden');
  document.getElementById('ordersSection').classList.add('hidden');
  await Promise.all([loadOrders(), loadDropers(), loadBalances()]);
  document.getElementById('loadingBlock').classList.add('hidden');
  renderOrders(); updateStats(); toast('🔄 Оновлено!');
}

// ── СТАТИСТИКА ─────────────────────────────────────────
function updateStats() {
  const today = new Date().toLocaleDateString('uk-UA');
  document.getElementById('stTotal').textContent  = allOrders.length;
  document.getElementById('stDone').textContent   = allOrders.filter(o=>o.status==='Виконано').length;
  document.getElementById('stRefused').textContent= allOrders.filter(o=>o.status==='Відмова клієнта').length;
  document.getElementById('stToday').textContent  = allOrders.filter(o=>{
    try { return new Date(o.date).toLocaleDateString('uk-UA')===today; } catch{ return false; }
  }).length;
}

// ── RENDER ЗАМОВЛЕНЬ ────────────────────────────────────
function renderOrders() {
  const q      = (document.getElementById('searchQ')?.value||'').toLowerCase().trim();
  const status = document.getElementById('fStatus')?.value||'all';

  let f = allOrders.filter(o => {
    if (status!=='all' && o.status!==status) return false;
    if (q) {
      const hay = [o.orderNum,o.droperCode,o.clientName,o.phone,o.ttn,
                   (o.items||[]).map(i=>i.name).join(' ')].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  document.getElementById('ordersCount').textContent = `Замовлень: ${f.length}`;
  document.getElementById('ordersSection').classList.remove('hidden');

  document.getElementById('ordersBody').innerHTML = f.map(o => {
    const items = o.items || [];
    const profit  = parseFloat(o.profit)||0;
    const pColor  = profit>=0?'var(--green)':'var(--red)';
    return `<tr>
      <td style="font-weight:900;color:var(--accent);">${o.orderNum||'—'}</td>
      <td style="font-size:.65rem;color:var(--text2);">${fmtDate(o.date)}</td>
      <td style="font-size:.7rem;font-weight:800;">${esc(o.droperCode)}</td>
      <td>
        <div style="font-size:.72rem;font-weight:700;">${esc(o.clientName||'—')}</div>
        <div style="font-size:.65rem;color:var(--text2);">${esc(o.phone||'—')}</div>
      </td>
      <td style="text-align:center;font-weight:700;">${items.length}</td>
      <td style="font-weight:900;color:${pColor};">${profit>=0?'+':''}${profit} ₴</td>
      <td><select onchange="quickStatus('${o.orderNum}', this.value)" class="text-xs font-bold py-0.5 px-1" style="border-radius:.4rem;">
        ${['Новий','Оброблено','Комплектація','Відправлено','Виконано','Відмова клієнта','Повернення']
          .map(s=>\`<option\${s===o.status?' selected':''}\>${s}</option>\`).join('')}
      </select></td>
      <td>
        <div style="display:flex;gap:4px;">
          <button onclick="openOrderModal('${o.orderNum}')" class="px-2 py-1 rounded text-xs font-bold text-white hover:opacity-80"
                  style="background:var(--accent);" title="Деталі">
            <i class="fa-solid fa-pen-to-square"></i>
          </button>
          <button onclick="confirmDeleteOrder('${o.orderNum}')" class="px-2 py-1 rounded text-xs font-bold hover:text-red-500"
                  style="background:var(--surface2);border:1px solid var(--border);color:var(--text2);">
            <i class="fa-solid fa-trash"></i>
          </button>
        </div>
      </td>
    </tr>`;
  }).join('');
}

// ── QUICK STATUS ────────────────────────────────────────
async function quickStatus(orderNum, status) {
  const res = await api('updateOrder', { orderNum, status });
  if (res.ok) { 
    const idx = allOrders.findIndex(o=>o.orderNum===orderNum);
    if (idx!==-1) allOrders[idx].status = status;
    updateStats();
    toast('✅ Статус змінено');
  } else toast('⚠️ '+res.error);
}

// ── MODAL ЗАМОВЛЕННЯ ────────────────────────────────────
function openOrderModal(orderNum) {
  const order = allOrders.find(o=>o.orderNum===orderNum);
  if (!order) return;
  editingOrder = JSON.parse(JSON.stringify(order)); // глибока копія

  document.getElementById('modalOrderNum').textContent = order.orderNum;
  document.getElementById('modalOrderDate').textContent = fmtDate(order.date);

  // Товари
  document.getElementById('itemsList').innerHTML = (editingOrder.items||[]).map((it, idx) => `
    <div class="item-edit">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem;">
        <span style="font-weight:700;color:var(--accent);">${idx+1}. ${esc(it.name)}</span>
        <button onclick="removeItem(${idx})" class="text-xs font-bold hover:text-red-500" style="background:none;border:none;color:var(--text2);">
          <i class="fa-solid fa-trash"></i>
        </button>
      </div>
      <div class="item-edit-row">
        <div>
          <label class="item-label">Назва товару</label>
          <input type="text" value="${esc(it.name)}" onchange="editingOrder.items[${idx}].name=this.value" class="w-full px-3 py-2 text-sm">
        </div>
        <div>
          <label class="item-label">ID товару</label>
          <input type="text" value="${esc(it.id)}" onchange="editingOrder.items[${idx}].id=this.value" class="w-full px-3 py-2 text-sm">
        </div>
      </div>
      <div class="item-edit-row">
        <div>
          <label class="item-label">Кількість</label>
          <input type="number" value="${it.count}" onchange="editingOrder.items[${idx}].count=parseInt(this.value);calcItemProfit(${idx})" class="w-full px-3 py-2 text-sm">
        </div>
        <div>
          <label class="item-label">Закупка за одиницю</label>
          <input type="number" value="${it.price}" onchange="editingOrder.items[${idx}].price=parseFloat(this.value);calcItemProfit(${idx})" step="0.01" class="w-full px-3 py-2 text-sm">
        </div>
      </div>
      <div class="item-edit-row">
        <div>
          <label class="item-label">Продаж за одиницю</label>
          <input type="number" value="${it.salePrice}" onchange="editingOrder.items[${idx}].salePrice=parseFloat(this.value);calcItemProfit(${idx})" step="0.01" class="w-full px-3 py-2 text-sm">
        </div>
        <div>
          <label class="item-label">Прибуток на одиницю</label>
          <div class="bebas" style="padding:.5rem;color:var(--green);font-size:.95rem;" id="itemProfit${idx}">+${(it.salePrice-it.price)*it.count} ₴</div>
        </div>
      </div>
    </div>
  `).join('');

  // Замовлення
  document.getElementById('editClientName').value = editingOrder.clientName || '';
  document.getElementById('editPhone').value = editingOrder.phone || '';
  document.getElementById('editCity').value = editingOrder.city || '';
  document.getElementById('editPayment').value = editingOrder.payment || 'Накладний платіж';
  document.getElementById('editTTN').value = editingOrder.ttn || '';
  document.getElementById('editStatus').value = editingOrder.status || 'Новий';

  // Ціни
  document.getElementById('editTotalBuy').value = editingOrder.totalBuy || 0;
  document.getElementById('editTotalSell').value = editingOrder.totalSell || 0;
  updateProfit();

  // Примітки
  document.getElementById('editAdminNote').value = editingOrder.adminNote || '';

  switchModalTab('items');
  document.getElementById('orderModal').classList.add('show');
}

function closeOrderModal() {
  document.getElementById('orderModal').classList.remove('show');
  editingOrder = null;
}

function removeItem(idx) {
  editingOrder.items.splice(idx, 1);
  openOrderModal(editingOrder.orderNum); // перезавантажити модаль
}

function addNewItem() {
  if (!editingOrder.items) editingOrder.items = [];
  editingOrder.items.push({
    id: '',
    name: 'Новий товар',
    vendor: '',
    count: 1,
    price: 0,
    salePrice: 0,
  });
  openOrderModal(editingOrder.orderNum);
}

function calcItemProfit(idx) {
  const it = editingOrder.items[idx];
  const profit = (it.salePrice - it.price) * it.count;
  document.getElementById('itemProfit'+idx).textContent = `+${profit.toFixed(2)} ₴`;
}

function updateProfit() {
  const buy  = parseFloat(document.getElementById('editTotalBuy').value) || 0;
  const sell = parseFloat(document.getElementById('editTotalSell').value) || 0;
  const profit = sell - buy;
  document.getElementById('editProfit').textContent = `${profit>=0?'+':''}${profit.toFixed(2)} ₴`;
  document.getElementById('editProfit').style.color = profit>=0?'var(--green)':'var(--red)';
}

async function saveOrderModal() {
  // Оновити поля з форми
  editingOrder.clientName = document.getElementById('editClientName').value;
  editingOrder.phone = document.getElementById('editPhone').value;
  editingOrder.city = document.getElementById('editCity').value;
  editingOrder.payment = document.getElementById('editPayment').value;
  editingOrder.ttn = document.getElementById('editTTN').value;
  editingOrder.status = document.getElementById('editStatus').value;
  editingOrder.totalBuy = parseFloat(document.getElementById('editTotalBuy').value) || 0;
  editingOrder.totalSell = parseFloat(document.getElementById('editTotalSell').value) || 0;
  editingOrder.profit = editingOrder.totalSell - editingOrder.totalBuy;
  editingOrder.adminNote = document.getElementById('editAdminNote').value;

  const res = await api('updateOrder', {
    orderNum: editingOrder.orderNum,
    clientName: editingOrder.clientName,
    phone: editingOrder.phone,
    city: editingOrder.city,
    payment: editingOrder.payment,
    ttn: editingOrder.ttn,
    status: editingOrder.status,
    totalBuy: editingOrder.totalBuy,
    totalSell: editingOrder.totalSell,
    profit: editingOrder.profit,
    adminNote: editingOrder.adminNote,
    items: editingOrder.items,
  });

  if (res.ok) {
    const idx = allOrders.findIndex(o=>o.orderNum===editingOrder.orderNum);
    if (idx!==-1) allOrders[idx] = editingOrder;
    updateStats();
    renderOrders();
    closeOrderModal();
    toast('✅ Замовлення збережено!');
  } else {
    toast('⚠️ '+res.error);
  }
}

async function confirmDeleteOrderModal() {
  if (!confirm(`Видалити замовлення ${editingOrder.orderNum}?`)) return;
  const res = await api('deleteOrder', { orderNum: editingOrder.orderNum });
  if (res.ok) {
    allOrders = allOrders.filter(o=>o.orderNum!==editingOrder.orderNum);
    updateStats();
    renderOrders();
    closeOrderModal();
    toast('🗑️ Видалено');
  } else toast('⚠️ '+res.error);
}

async function confirmDeleteOrder(orderNum) {
  if (!confirm(`Видалити замовлення ${orderNum}?`)) return;
  const res = await api('deleteOrder', { orderNum });
  if (res.ok) {
    allOrders = allOrders.filter(o=>o.orderNum!==orderNum);
    updateStats();
    renderOrders();
    toast('🗑️ Видалено');
  } else toast('⚠️ '+res.error);
}

// ── RENDER ДРОПЕРІВ ─────────────────────────────────────
function renderDropers() {
  document.getElementById('dropersCountLabel').textContent = `Дроперів: ${allDropers.length}`;
  document.getElementById('dropersBody').innerHTML = allDropers.map(d => {
    const b = allBalances[d.code] || {};
    const bal = b.profit||0;
    const bc = bal>=0?'var(--green)':'var(--red)';
    const isBlocked = d.active === false;
    return `<tr style="${isBlocked?'opacity:.55':''}">
      <td style="font-weight:900;color:var(--accent);">${d.code}</td>
      <td style="font-weight:700;">${esc(d.name||'—')}</td>
      <td style="font-size:.7rem;">${esc(d.phone||'—')}</td>
      <td style="font-size:.7rem;">${d.site?`<a href="${d.site.startsWith('http')?d.site:'//'+d.site}" target="_blank" style="color:var(--accent);">${esc(d.site)}</a>`:'—'}</td>
      <td style="font-size:.7rem;font-family:monospace;">${esc(d.card||'—')}</td>
      <td style="font-weight:700;text-align:center;">${b.totalOrders||0}</td>
      <td style="font-weight:900;color:${bc};">${bal>=0?'+':''}${bal} ₴</td>
      <td>
        <div style="display:flex;gap:4px;">
          <button onclick="toggleBlock('${d.code}',${!isBlocked})" class="px-2 py-1 rounded text-xs font-bold text-white hover:opacity-80"
                  style="background:${isBlocked?'var(--green)':'var(--red)'};">
            ${isBlocked?'Розблок':'Блок'}
          </button>
          <button onclick="confirmDeleteDroper('${d.code}','${esc(d.name)}')" class="px-2 py-1 rounded text-xs font-bold hover:text-red-500"
                  style="background:var(--surface2);border:1px solid var(--border);color:var(--text2);">
            <i class="fa-solid fa-trash"></i>
          </button>
        </div>
      </td>
    </tr>`;
  }).join('');
}

async function toggleBlock(code, newActive) {
  const res = await api('updateDroper', { code, active: newActive });
  if (res.ok) { await loadDropers(); renderDropers(); toast(newActive?'✅ Розблоковано':'🔒 Заблоковано'); }
  else toast('⚠️ '+res.error);
}
async function confirmDeleteDroper(code, name) {
  if (!confirm(`Видалити дропера ${code} (${name})?`)) return;
  const res = await api('deleteDroper', { code });
  if (res.ok) { await loadDropers(); renderDropers(); toast('🗑️ Видалено'); }
  else toast('⚠️ '+res.error);
}
async function submitAddDroper() {
  const name = document.getElementById('dnName').value.trim();
  if (!name) { toast('⚠️ Введіть ім\'я'); return; }
  const code = document.getElementById('dnCode').value.trim().toUpperCase() || undefined;
  const res = await api('addDroper', {
    name, code,
    phone:   document.getElementById('dnPhone').value.trim(),
    site:    document.getElementById('dnSite').value.trim(),
    card:    document.getElementById('dnCard').value.trim(),
    comment: document.getElementById('dnComment').value.trim(),
  });
  if (res.ok) {
    toast(`✅ Дропер ${res.droper.code} додано!`, 4000);
    navigator.clipboard.writeText(res.droper.code).catch(()=>{});
    document.getElementById('addForm').classList.add('hidden');
    ['dnName','dnPhone','dnCode','dnSite','dnCard','dnComment'].forEach(id => document.getElementById(id).value='');
    await loadDropers(); await loadBalances(); renderDropers();
  } else toast('⚠️ '+res.error);
}

// ── HELPERS ────────────────────────────────────────────
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtDate(d) {
  if (!d) return '—';
  try {
    const dt = new Date(d);
    return dt.toLocaleDateString('uk-UA',{day:'2-digit',month:'2-digit',year:'2-digit'}) + ' ' +
           dt.toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'});
  } catch { return String(d).slice(0,16); }
}

// ── EXCEL ──────────────────────────────────────────────
function exportExcel() {
  if (!allOrders.length) { toast('⚠️ Немає даних'); return; }
  const wsData = [['Замовлення','Дата','Дропер','Клієнт','Телефон','Місто','Товари','Закупка','Продаж','Прибуток','ТТН','Статус']];
  allOrders.forEach(o => {
    const items = (o.items||[]).map(it=>`${it.name} (${it.count}шт)`).join('; ');
    wsData.push([o.orderNum,o.dateDisplay||o.date,o.droperCode,o.clientName,o.phone,o.city,items,
                 o.totalBuy||0,o.totalSell||0,o.profit||0,o.ttn,o.status]);
  });
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(wsData);
  ws['!cols'] = [16,14,10,16,14,20,40,9,9,9,16,14].map(w=>({wch:w}));
  XLSX.utils.book_append_sheet(wb, ws, 'Замовлення');
  XLSX.writeFile(wb, `utrade_${new Date().toISOString().slice(0,10)}.xlsx`);
  toast('📗 Excel завантажено!');
}
</script>

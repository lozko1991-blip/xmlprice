name: Master Eva Feed Update

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'masterevaxml.py'
      - 'process_xml.py'
      - 'feed.xml'
      - '**.html'
      - '**.py'
      - '**.xml'

  schedule:
    - cron: '0 */4 * * *'

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build_master_feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests lxml

      - name: Run Master Eva Script
        run: python masterevaxml.py

      - name: Save REPORT and logs to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add REPORT.md price_warnings.log --force
          git diff --staged --quiet || git commit -m "Auto update: report"
          git push

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build_master_feed
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
